version: 0.2

phases:
  install:
    commands:
      - echo Installing dependencies...
      
  pre_build:
    commands:
      - echo Pre-build phase started on `date`
      
  build:
    commands:
      - echo Build phase started on `date`
      - echo Building application...
      # Thêm lệnh build của bạn ở đây (npm install, npm run build, etc.)
      # Nếu NextJS thì dùng các lệnh tương ứng lần 1
      
  post_build:
    commands:
      - echo Build completed on `date`

artifacts:
  files:
    - '**/*'
  name: BuildArtifact
